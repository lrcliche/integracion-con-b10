services:

  postgres:
    image: postgres:16

    container_name: devstore_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: integration_store

    ports:
      - "5432:5432"

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend

    container_name: devstore_backend

    ports:
      - "8080:8080"

    environment:
      APP_ENV: development
      APP_PORT: 8080
      READ_TIMEOUT_SECONDS: 10
      WRITE_TIMEOUT_SECONDS: 10
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: integration_store
      DB_SSLMODE: disable

    depends_on:
      - postgres

  frontend:
    build: ./frontend

    container_name: devstore_frontend

    ports:
      - "5173:5173"

    environment:
      VITE_PROXY_TARGET: http://backend:8080
      VITE_API_URL: ""

    depends_on:
      - backend