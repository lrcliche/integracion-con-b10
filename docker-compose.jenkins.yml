name: jenkins-ci

services:
  jenkins:
    build:
      context: .
      dockerfile: .jenkins/Dockerfile
    container_name: jenkins-local
    restart: unless-stopped
    user: root
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: